name: foodbridge

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodbridge}
      POSTGRES_DB: ${POSTGRES_DB:-foodbridge}
    ports:
      - "5432:5432"
    volumes:
      - foodbridge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodbridge} -d ${POSTGRES_DB:-foodbridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foodbridge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-foodbridge123}
      # The browser PUTs listing images cross-origin straight to MinIO, so the
      # S3 API itself has to answer the preflight — the API never sees the bytes.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - foodbridge_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket, keeps it private, and installs the rule that
  # sweeps abandoned uploads. Exits 0 and stays `Exited` — that's the success state.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foodbridge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-foodbridge123}
      S3_BUCKET: ${S3_BUCKET:-foodbridge-listings}
    entrypoint: >
      /bin/sh -c "
      mc alias set fb http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing fb/$$S3_BUCKET &&
      mc anonymous set none fb/$$S3_BUCKET &&
      mc ilm rule add --expire-days 1 --prefix 'pending/' fb/$$S3_BUCKET 2>/dev/null || true
      "

volumes:
  foodbridge_pg_data:
  foodbridge_minio_data:
